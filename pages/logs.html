<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал браузера - BunPinokWeb</title>
<style>
:root {
  --bg: #1e1e1e; --text: #d4d4d4; --muted: #808080;
  --error: #f48771; --warn: #e5c07b; --info: #61afef; --accent: #1a73e8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100vh; background: var(--bg); color: var(--text); font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px; overflow: hidden; }
.toolbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #252526; border-bottom: 1px solid #333;
  font-family: system-ui, 'Segoe UI', sans-serif;
}
.toolbar h1 { font-size: 15px; font-weight: 500; }
.toolbar .spacer { flex: 1; }
.toolbar button {
  border: 1px solid #444; background: #2d2d2d; color: #ccc;
  border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 12px;
}
.toolbar button:hover { background: #3c3c3c; }
.toolbar .back-link { color: var(--accent); text-decoration: none; cursor: pointer; font-size: 13px; }
.toolbar .back-link:hover { text-decoration: underline; }
#log-view {
  height: calc(100vh - 48px); overflow-y: auto; padding: 10px 14px;
  white-space: pre-wrap; word-break: break-all; line-height: 1.5;
}
.line.error { color: var(--error); }
.line.warn { color: var(--warn); }
.line.info { color: var(--info); }
.path-hint { font-size: 11px; color: var(--muted); font-family: system-ui; padding: 4px 14px; background: #252526; border-top: 1px solid #333; }
</style>
</head>
<body>
<div class="toolbar">
  <a class="back-link" onclick="history.back()">← Назад</a>
  <h1>Журнал браузера</h1>
  <div class="spacer"></div>
  <label style="font-size:12px;color:#999"><input type="checkbox" id="autoscroll" checked style="margin-right:4px">Автопрокрутка</label>
  <button id="refresh-btn">Обновить</button>
  <button id="export-btn">Экспортировать</button>
  <button id="clear-btn">Очистить</button>
</div>
<div id="log-view"></div>
<div class="path-hint" id="path-hint">Загрузка путей...</div>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function refresh() {
  const text = await window.browserAPI.logs.read();
  const view = document.getElementById('log-view');
  if (!text) {
    view.textContent = '(журнал пуст)';
    return;
  }
  const lines = text.split('\n');
  let html = '';
  for (const rawLine of lines) {
    let cssClass = 'info';
    if (rawLine.includes('[ERROR]')) {
      cssClass = 'error';
    } else if (rawLine.includes('[WARN]')) {
      cssClass = 'warn';
    }
    html += '<div class="line ' + cssClass + '">' + escapeHtml(rawLine) + '</div>';
  }
  view.innerHTML = html;
  const autoscroll = document.getElementById('autoscroll');
  if (autoscroll.checked) {
    view.scrollTop = view.scrollHeight;
  }
}

async function loadPaths() {
  const paths = await window.browserAPI.logs.getPath();
  document.getElementById('path-hint').textContent =
    'Файлы: ' + paths.main + ' | ' + paths.chromium;
}

document.getElementById('refresh-btn').addEventListener('click', refresh);
document.getElementById('export-btn').addEventListener('click', async () => {
  const text = await window.browserAPI.logs.read();
  if (!text) {
    return;
  }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  a.download = 'bunpinokweb-log-' + stamp + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 5000);
});
document.getElementById('clear-btn').addEventListener('click', async () => {
  await window.browserAPI.logs.clear();
  refresh();
});

refresh();
loadPaths();
setInterval(refresh, 2000);
</script>
</body>
</html>
