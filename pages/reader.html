<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Режим чтения - BunPinokWeb</title>
<style>
:root {
  --bg: #faf6ef; --text: #202124; --muted: #5f6368; --accent: #1a73e8;
  --content-bg: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #1f1f1f; --text: #e8eaed; --muted: #9aa0a6; --content-bg: #2a2a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100vh; background: var(--bg); color: var(--text); font-family: Georgia, 'Times New Roman', serif; overflow: hidden; }
.toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: var(--bg); border-bottom: 1px solid rgba(0,0,0,0.1); z-index: 10;
}
.toolbar button {
  border: 1px solid rgba(0,0,0,0.15); background: transparent; color: var(--text);
  border-radius: 16px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  font-family: system-ui, 'Segoe UI', sans-serif;
}
.toolbar button:hover { background: rgba(0,0,0,0.06); }
.toolbar .spacer { flex: 1; }
.content {
  height: calc(100vh - 48px); overflow-y: auto; margin-top: 48px;
}
.article {
  max-width: 700px; margin: 0 auto; padding: 32px 24px 80px;
  background: var(--content-bg); font-size: 18px; line-height: 1.65;
}
.article h1 { font-size: 30px; line-height: 1.3; margin-bottom: 16px; font-family: Georgia, serif; }
.article h2, .article h3 { margin: 24px 0 12px; line-height: 1.3; }
.article p { margin: 0 0 16px; }
.article img { max-width: 100%; height: auto; border-radius: 6px; margin: 12px 0; }
.article a { color: var(--accent); }
.article ul, .article ol { margin: 0 0 16px 24px; }
.article blockquote { border-left: 3px solid var(--accent); margin: 16px 0; padding: 4px 16px; color: var(--muted); }
.source { color: var(--muted); font-size: 13px; font-family: system-ui, sans-serif; margin-bottom: 24px; word-break: break-all; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="back-btn">← Назад</button>
  <button id="font-down-btn" title="Уменьшить шрифт">А−</button>
  <button id="font-up-btn" title="Увеличить шрифт">А+</button>
  <div class="spacer"></div>
  <button id="theme-btn" title="Переключить тему">🌓</button>
</div>
<div class="content">
  <div class="article" id="article">
    <div id="article-body">Загрузка...</div>
  </div>
</div>

<script>
let fontSize = 18;

function escapeHtmlForRender(html) {
  return html;
}

async function loadArticle() {
  const content = await window.browserAPI.reader.getContent();
  const article = document.getElementById('article');
  if (!content) {
    article.innerHTML = '<p>Не удалось извлечь содержимое страницы.</p>';
    return;
  }
  let html = '';
  if (content.title) {
    html += '<h1>' + escapeHtml(content.title) + '</h1>';
  }
  if (content.url) {
    html += '<div class="source">Источник: ' + escapeHtml(content.url) + '</div>';
  }
  html += content.html || '<p>Пустая страница</p>';
  document.getElementById('article-body').innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  let safeStr = '';
  if (str) {
    safeStr = String(str);
  }
  div.textContent = safeStr;
  return div.innerHTML;
}

document.getElementById('back-btn').addEventListener('click', async () => {
  const active = await window.browserAPI.tabs.getActive();
  if (active) {
    await window.browserAPI.tabs.goBack(active.id);
  }
});

document.getElementById('font-up-btn').addEventListener('click', () => {
  fontSize = Math.min(fontSize + 2, 28);
  document.querySelector('.article').style.fontSize = fontSize + 'px';
});

document.getElementById('font-down-btn').addEventListener('click', () => {
  fontSize = Math.max(fontSize - 2, 14);
  document.querySelector('.article').style.fontSize = fontSize + 'px';
});

document.getElementById('theme-btn').addEventListener('click', () => {
  const root = document.documentElement;
  if (root.getAttribute('data-theme') === 'dark') {
    root.removeAttribute('data-theme');
  } else {
    root.setAttribute('data-theme', 'dark');
  }
});

loadArticle();
</script>
</body>
</html>
